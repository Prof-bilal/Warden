<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Warden · Install Guard</title>
<style>
  html, body { margin: 0; }
  * { box-sizing: border-box; }
  #install-guard {
    width: 1920px; height: 1080px;
    background: #111714; color: #eeefe9;
    font-family: system-ui, sans-serif;
  }
  .frame { position: absolute; inset: 126px 178px auto; }
  .eyebrow { margin: 0 0 24px; color: #bef488; letter-spacing: .13em; font: 32px monospace; }
  h1 { margin: 0; max-width: 1320px; font-size: 107px; line-height: .98; letter-spacing: -.045em; }
  .context { margin: 26px 0 0; font-size: 38px; color: #c6d1c4; }
  .proof {
    position: absolute; inset: 492px 178px auto; min-height: 274px;
    border: 2px solid #49604f; background: #1a241d; padding: 40px 51px;
  }
  .proof p { margin: 0 0 22px; font: 36px monospace; color: #c6d1c4; }
  .proof output { display: block; color: #ffd4a5; font: 37px/1.35 monospace; }
  .link { position: absolute; inset: auto 178px 126px; color: #bef488; font: 35px monospace; }
</style>
<div id="install-guard" data-composition-id="install-guard" data-width="1920" data-height="1080" data-duration="15" data-fps="30">
  <div id="intro" class="frame clip" data-start="0" data-duration="15" data-track-index="0">
    <p class="eyebrow">WARDEN / INSTALL GUARD</p>
    <h1>Two hours old.<br>Install blocked.</h1>
    <p class="context">npm release-age check · Local registry fixture</p>
  </div>
  <div id="decision" class="proof clip" data-start="3" data-duration="12" data-track-index="1">
    <div class="decision-content">
      <p>Fixture release · example@1.0.0</p>
      <output>blocked "example@1.0.0":<br>release age 2h0m0s is below the minimum 48h0m0s</output>
    </div>
  </div>
  <div id="guide" class="link clip" data-start="10" data-duration="5" data-track-index="2">
    <span>Read the guide · /docs/install-guard</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
  const timeline = gsap.timeline({ paused: true });
  timeline.from(".decision-content", { y: 14, opacity: 0, duration: 0.4 }, 3);
  timeline.from(".link span", { opacity: 0, duration: 0.35 }, 10);
  window.__timelines = { "install-guard": timeline };
</script>
</html>
