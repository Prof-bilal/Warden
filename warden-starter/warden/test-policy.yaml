# Policy for filesystem MCP server test
command: ["node", "./mcp-test/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js", "./test-data"]

filesystem:
  read:
    - "./test-data"
  write:
    - "./test-data"

network:
  allow: []

env:
  allow: []

limits:
  memory_mb: 256
  timeout_s: 300
