name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # GitHub-hosted Windows runners run elevated, so the WFP/AppContainer/ETW
  # escape and lifecycle tests execute for real instead of skipping: this job
  # is the verifier for the Windows backend's syscall mirrors and the ETW
  # session (see syscalls.go and etw.go).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
