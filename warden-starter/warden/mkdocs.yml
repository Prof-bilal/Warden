site_name: Warden
site_description: A lightweight sandbox runtime for MCP servers
site_url: https://prof-bilal.github.io/Warden

theme:
  name: material
  palette:
    primary: blue
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock
repo_url: https://github.com/Prof-bilal/Warden
repo_name: Prof-bilal/Warden

nav:
  - Home: index.md
  - About: about.md
  - Start:
    - Install: install.md
    - How to Use Warden: how-to-use.md
    - Quickstart: quickstart.md
    - FAQ: faq.md
  - Reference:
    - Schema Reference: schema.md
    - CLI Reference: cli.md
    - Example Policies: examples.md
  - Understand:
    - Architecture: architecture.md
    - Security Review: security.md
    - Proof & Test Results: proof.md
    - Compatibility Matrix: compatibility.md
  - Community:
    - Gateway Integration: gateway.md
    - Interactive Approval: approve.md
    - Beta Program: beta.md
  - Archive:
    - Full Design Doc: design.md
    - Roadmap: roadmap.md
    - Product Requirements: prd.md
    - MVP Scope: mvp.md
    - About This Project: about.md
  - Project:
    - Contributing: contributing.md
    - Testing Guide: testing.md
    - Testing Platforms: testing-platforms.md
    - Code Style: codestyle.md
    - Review Guide: reviewing.md
    - License: license.md
    - Deploying These Docs: deploy.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
