site_name: Warden
site_description: An open-source permission boundary for local tools and MCP servers
site_url: https://prof-bilal.github.io/Warden

theme:
  name: material
  palette:
    primary: blue
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock
repo_url: https://github.com/Prof-bilal/Warden
repo_name: Prof-bilal/Warden

nav:
  - Home: index.md
  - Start here:
    - Introduction: index.md
    - Install: install.md
    - Quickstart: quickstart.md
    - How Warden works: how-to-use.md
    - FAQ: faq.md
  - Protect a tool:
    - Files and policies: examples.md
    - AI agent workspace: agent-workspace.md
    - MCP gateway: mcp-gateway.md
    - Client proxy: client-proxy.md
  - Platforms and security:
    - Compatibility: compatibility.md
    - Security review: security.md
    - Test evidence: proof.md
    - Architecture: architecture.md
    - Linux local testing: platforms/linux-local-setup.md
    - Windows testing: platforms/windows-testing.md
  - Evidence and operations:
    - End-to-end proof runbook: verification/e2e-proof-test.md
    - End-to-end proof results: verification/e2e-proof-results.md
    - Release preview status: operations/release-preview-status.md
  - Reference:
    - Policy schema: schema.md
    - CLI reference: cli.md
    - Example policies: examples.md
  - Project and contribution:
    - Contributing: contributing.md
    - Testing Guide: testing.md
    - Testing Platforms: testing-platforms.md
    - Code Style: codestyle.md
    - Review Guide: reviewing.md
    - License: license.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
