# Fixture policy — @modelcontextprotocol/server-gdrive (compat: pass)
command: ["/usr/bin/node", "./server/dist/index.js"]
filesystem:
  read:
    - "./config/credentials.json"
  write:
    - "./data/cache"
network:
  allow:
    - "www.googleapis.com"
    - "oauth2.googleapis.com"
    - "drive.google.com"
env:
  allow:
    - "GOOGLE_CLIENT_ID"
    - "GOOGLE_CLIENT_SECRET"
    - "HOME"
limits:
  memory_mb: 256
  timeout_s: 300
