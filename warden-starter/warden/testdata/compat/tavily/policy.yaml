# Fixture policy — community tavily-mcp web search (compat: pass)
command: ["/usr/bin/node", "./server/dist/index.js"]
filesystem:
  read: []
  write:
    - "./data/cache"
network:
  allow:
    - "api.tavily.com"
env:
  allow:
    - "TAVILY_API_KEY"
    - "HOME"
limits:
  memory_mb: 128
  timeout_s: 60
