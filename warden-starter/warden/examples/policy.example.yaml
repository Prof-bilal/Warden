# Example Warden policy — sandboxing a hypothetical GitHub-issues MCP server.
# Copy this, adjust the paths/hosts, and pass it to `warden run --policy`.
#
# Relative paths below are resolved against THIS FILE's directory, not your
# shell's CWD. The executable must be an absolute path: the sandbox binds its
# parent directory, and a bare command name would resolve nowhere inside.

command: ["/usr/bin/node", "./server/index.js"]

filesystem:
  # Read-only: the server can read from here but not modify anything.
  read:
    - "./data/cache"
  # Read-write: the server can create/modify/delete files here, nowhere else.
  write:
    - "./data/output"

network:
  # Enforced on Linux: only these hosts are reachable. DNS lookups for other
  # hosts are blocked at the sandbox boundary.
  allow:
    - "api.github.com"

env:
  # Only these environment variables are passed through from the parent
  # shell. Values are NOT stored here — this just lists which names to
  # forward.
  allow:
    - "GITHUB_TOKEN"

limits:
  # Enforced on Linux: resident memory for the process tree and wall-clock
  # time. Warden terminates the process group cleanly on a breach.
  memory_mb: 512
  timeout_s: 300
