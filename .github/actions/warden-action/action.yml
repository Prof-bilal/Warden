name: 'Warden Sandbox Action'
description: 'Run commands inside Warden sandbox with policy enforcement in CI/CD'
author: 'Warden Security'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  policy:
    description: 'Path to Warden policy.yaml file'
    required: true
  run:
    description: 'Command to run inside the sandbox'
    required: true
  backend:
    description: 'Sandbox backend (auto, linux, docker)'
    required: false
    default: 'auto'
  approve:
    description: 'Enable interactive approval mode'
    required: false
    default: 'false'
  warden-version:
    description: 'Warden release tag to download from GitHub Releases (default: latest). A checked-in dist/warden-linux-amd64 binary takes precedence when present; otherwise the latest release is used.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the command'
    required: false
    default: '.'

outputs:
  exit-code:
    description: 'Exit code of the sandboxed command'

runs:
  using: 'composite'
  steps:
    - name: Validate environment
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "::error::Warden Action currently supports Linux runners only"
          exit 1
        fi
        
        # Check for required tools
        if ! command -v strace &> /dev/null; then
          echo "::error::strace is required but not installed. Install with: apt-get update && apt-get install -y strace"
          exit 1
        fi
        
        # Check for bubblewrap availability (required for Linux backend)
        if ! command -v bwrap &> /dev/null; then
          echo "::warning::bubblewrap not found, will attempt installation"
        fi

    - name: Install Warden
      shell: bash
      run: |
        # Install the Warden binary. Order of preference:
        # 1) Checked-in dist binary (matches this commit).
        # 2) Release binary from GitHub Releases.
        # 3) Build from source (requires Go).
        WARDEN_VERSION="${{ inputs.warden-version }}"
        BIN_NAME="warden-linux-amd64"
        TARGET="/usr/local/bin/warden"

        # 1) Repo-local dist binary. dist/ is no longer committed to the repo
        #    (built binaries are not tracked); the file is only present if a
        #    workflow artifact or a local build placed it there.
        if [[ -x "dist/$BIN_NAME" ]]; then
          echo "::notice::Using checked-in dist/$BIN_NAME"
          sudo install -m 0755 "dist/$BIN_NAME" "$TARGET"
          warden version
          exit 0
        fi

        # 2) Download a release binary from GitHub Releases.
        REPO="${{ github.repository }}"
        if [[ -z "$WARDEN_VERSION" || "$WARDEN_VERSION" == "latest" ]]; then
          RELEASE_URL="https://github.com/${REPO}/releases/latest/download/${BIN_NAME}"
        else
          RELEASE_URL="https://github.com/${REPO}/releases/download/${WARDEN_VERSION}/${BIN_NAME}"
        fi

        echo "::notice::Downloading Warden from $RELEASE_URL"
        TMP="$(mktemp)"
        if curl -fsSL -o "$TMP" "$RELEASE_URL"; then
          sudo install -m 0755 "$TMP" "$TARGET"
          rm -f "$TMP"
          warden version
          exit 0
        fi
        rm -f "$TMP"
        echo "::warning::Could not download release binary, falling back to build from source"

        # 3) Build from source (Go is available on GitHub Actions runners).
        #    Build from the module directory: the only Go module in this repo
        #    lives at warden-starter/warden (module
        #    github.com/warden-sandbox/warden); there is no module at the
        #    workspace root, so a root-level `go build` of this package cannot
        #    resolve it.
        #    The runner's Go toolchain must satisfy the `go` directive in
        #    warden-starter/warden/go.mod (modern Go auto-switches toolchains
        #    when allowed; otherwise Go itself reports a clear version error).
        MOD_DIR="warden-starter/warden"
        if [[ -f "$MOD_DIR/go.mod" ]] && command -v go &> /dev/null; then
          echo "::notice::Building Warden from source ($MOD_DIR, $(go env GOVERSION))"
          if ! ( cd "$MOD_DIR" && CGO_ENABLED=0 go build -o "$TARGET" ./cmd/warden ); then
            echo "::error::go build failed in $MOD_DIR. Check that the Go toolchain ($(go env GOVERSION)) satisfies the go directive in $MOD_DIR/go.mod ($(sed -n 's/^go //p' "$MOD_DIR/go.mod" | head -1))."
            exit 1
          fi
          warden version
          exit 0
        fi

        echo "::error::Could not install Warden. Download failed and Go source not found."
        exit 1

    - name: Install bubblewrap if needed
      shell: bash
      run: |
        if ! command -v bwrap &> /dev/null; then
          echo "::notice::Installing bubblewrap"
          sudo apt-get update
          sudo apt-get install -y bubblewrap
        fi

    - name: Detect sandbox backend
      shell: bash
      run: |
        # Test if bwrap can actually create network namespaces.
        # GitHub Actions ubuntu-latest blocks unprivileged user namespaces
        # via AppArmor (kernel.apparmor_restrict_unprivileged_userns=1),
        # which makes bwrap fail with "RTM_NEWADDR: Operation not permitted".
        # When this happens we fall back to the Docker backend.
        BWRAP_OK=false
        if command -v bwrap &> /dev/null; then
          if bwrap --ro-bind / / --unshare-net -- echo bwrap-ok 2>/dev/null; then
            BWRAP_OK=true
          fi
        fi

        if [[ "$BWRAP_OK" == "true" ]]; then
          echo "WARDEN_DETECTED_BACKEND=linux" >> "$GITHUB_ENV"
          echo "::notice::bubblewrap network namespace OK, using linux backend"
        elif command -v docker &> /dev/null && docker info >/dev/null 2>&1; then
          echo "WARDEN_DETECTED_BACKEND=docker" >> "$GITHUB_ENV"
          echo "::warning::bubblewrap cannot create network namespaces (AppArmor restriction), falling back to docker backend"
        else
          echo "::error::bubblewrap cannot create network namespaces and docker is not available. Use a self-hosted runner with user namespaces enabled."
          exit 1
        fi

    - name: Pull Docker image (Docker backend only)
      if: env.WARDEN_DETECTED_BACKEND == 'docker'
      shell: bash
      run: |
        DOCKER_IMAGE="${WARDEN_DOCKER_IMAGE:-alpine:3.20}"
        echo "::notice::Pulling Docker image $DOCKER_IMAGE for sandbox backend"
        docker pull "$DOCKER_IMAGE"

    - name: Validate Warden setup
      shell: bash
      run: |
        echo "::group::Warden doctor check"
        warden doctor || {
          echo "::error::Warden sandbox check failed. The runner environment may not support sandboxing."
          exit 1
        }
        echo "::endgroup::"

    - name: Validate policy file
      shell: bash
      env:
        # Pass policy via env so multiline inline YAML is not re-parsed by the
        # shell as code (same transport pattern as the run step below).
        WARDEN_POLICY_INPUT: ${{ inputs.policy }}
      run: |
        WORKING_DIR="${{ inputs.working-directory }}"
        cd "$WORKING_DIR"

        if [[ "$WARDEN_POLICY_INPUT" == *$'\n'* ]]; then
          POLICY_PATH="$RUNNER_TEMP/warden-inline-policy.yaml"
          printf '%s\n' "$WARDEN_POLICY_INPUT" > "$POLICY_PATH"
          echo "::notice::Using inline policy (written to $POLICY_PATH)"
        else
          POLICY_PATH="$WARDEN_POLICY_INPUT"
          if [[ ! -f "$POLICY_PATH" ]]; then
            echo "::error::Policy file not found: $POLICY_PATH"
            exit 1
          fi
          echo "::notice::Using policy: $POLICY_PATH"
        fi
        echo "WARDEN_POLICY_PATH=$POLICY_PATH" >> "$GITHUB_ENV"

        # Validate policy syntax (dry run)
        echo "::group::Policy validation"
        if ! warden run --policy "$POLICY_PATH" --help > /dev/null 2>&1; then
          echo "::error::Policy file validation failed"
          exit 1
        fi
        echo "::endgroup::"

    - name: Run command in sandbox
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # CRITICAL: do not interpolate inputs.run into the shell script body.
        # Multiline commands, heredocs, quotes, and parentheses must be
        # preserved byte-for-byte via an env var → script file → warden.
        WARDEN_COMMAND: ${{ inputs.run }}
      run: |
        set +e  # Don't exit on command failure - we want to capture exit code
        
        POLICY_PATH="${WARDEN_POLICY_PATH:-}"
        if [[ -z "$POLICY_PATH" ]]; then
          echo "::error::WARDEN_POLICY_PATH is unset; policy validation step must run first"
          exit 1
        fi
        BACKEND="${{ inputs.backend }}"
        # Use auto-detected backend when user hasn't explicitly chosen one.
        if [[ "$BACKEND" == "auto" ]]; then
          BACKEND="${WARDEN_DETECTED_BACKEND:-linux}"
        fi
        APPROVE="${{ inputs.approve }}"

        # Write the user command to a script file so shell metacharacters and
        # multiline content are never re-parsed by this composite step.
        # Prefer the working directory (always policy-granted as ".") over
        # RUNNER_TEMP, which may sit outside the sandbox filesystem grants.
        SCRIPT="$(pwd)/.warden-action-cmd.sh"
        # Ensure a trailing newline so the final line always executes.
        printf '%s\n' "$WARDEN_COMMAND" > "$SCRIPT"
        chmod +x "$SCRIPT"
        
        WARDEN_ARGS=(run --policy "$POLICY_PATH")
        
        if [[ "$BACKEND" != "auto" ]]; then
          WARDEN_ARGS+=(--backend "$BACKEND")
        fi
        
        if [[ "$APPROVE" == "true" ]]; then
          WARDEN_ARGS+=(--approve)
        fi
        
        # Execute via an absolute shell path so heredocs / operators /
        # parentheses work as in a normal job. Relative "bash" is rejected by
        # the sandbox (commands must be absolute). Exit code propagates.
        SHELL_BIN="$(command -v bash || true)"
        if [[ -z "$SHELL_BIN" || "$SHELL_BIN" != /* ]]; then
          SHELL_BIN=/bin/bash
        fi
        WARDEN_ARGS+=(-- "$SHELL_BIN" "$SCRIPT")
        
        echo "::group::Warden execution"
        echo "::notice::Running sandboxed script: $SCRIPT via $SHELL_BIN"
        
        warden "${WARDEN_ARGS[@]}"
        EXIT_CODE=$?
        
        rm -f "$SCRIPT"
        
        echo "::endgroup::"
        
        # Set output
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        
        # Handle exit code (audit upload runs in a later always() step)
        if [[ $EXIT_CODE -ne 0 ]]; then
          echo "::error::Sandboxed command failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
        
        echo "::notice::Sandboxed command completed successfully"

    - name: Upload audit logs
      shell: bash
      if: always()
      run: |
        # Find the latest audit log. Runs even when the sandboxed command
        # failed so CI still gets a blocked-access summary.
        AUDIT_DIR="$HOME/.local/state/warden"
        if [[ -d "$AUDIT_DIR" ]] && [[ -f "$AUDIT_DIR/audit.jsonl" ]]; then
          echo "::notice::Audit log available at $AUDIT_DIR/audit.jsonl"
          
          # For security, we should be careful about what we log
          # Only show basic stats, not full content which might contain secrets
          if [[ -s "$AUDIT_DIR/audit.jsonl" ]]; then
            EVENTS_COUNT=$(wc -l < "$AUDIT_DIR/audit.jsonl")
            echo "::notice::Recorded $EVENTS_COUNT audit events"
            
            # Show any blocked attempts (these are security-relevant).
            # Audit records mark denied accesses with "allowed":false; the
            # resource field names the blocked path or host.
            if grep -q '"allowed":false' "$AUDIT_DIR/audit.jsonl"; then
              echo "::warning::Some operations were blocked by the sandbox policy"
              echo "::group::Blocked operations summary"
              grep '"allowed":false' "$AUDIT_DIR/audit.jsonl" | jq -r '.resource // .reason' | sort | uniq -c | head -10
              echo "::endgroup::"
            fi
          fi
        else
          echo "::notice::No audit log generated"
        fi
