# AI Code Review Policy for GitHub Actions
# This policy allows AI agents to read code and write reports while preventing
# access to secrets and unauthorized network connections.

command: ["bash", "-c"]

filesystem:
  read:
    # Repository access
    - "."
    - "/tmp"
    - "/usr/bin"
    - "/bin"
    - "/usr/lib"
    - "/lib"
    - "/lib64"
    - "/etc/ssl"
    - "/etc/ca-certificates"
    
  write:
    # Temporary files and reports only
    - "/tmp"
    - "./tmp"
    - "./reports"
    - "./analysis-output"

network:
  allow:
    # AI service endpoints
    - "api.anthropic.com"
    - "api.openai.com"
    
    # GitHub API (if needed for PR comments)
    - "api.github.com"
    
    # Essential services
    - "github.com"

env:
  allow:
    # AI API keys
    - "ANTHROPIC_API_KEY"
    - "OPENAI_API_KEY"
    
    # GitHub integration
    - "GITHUB_TOKEN"
    - "GITHUB_REPOSITORY"
    - "GITHUB_SHA"
    - "GITHUB_REF"
    - "GITHUB_EVENT_NAME"
    
    # CI environment
    - "CI"
    - "GITHUB_ACTIONS"
    - "RUNNER_OS"
    
    # Essential system variables
    - "PATH"
    - "HOME"
    - "USER"
    - "PWD"
    - "TERM"

limits:
  memory_mb: 1024
  timeout_s: 600  # 10 minutes max

# Notes:
# - This policy allows reading the entire repository for code analysis
# - Network access is restricted to known AI and GitHub endpoints
# - Only specific environment variables are exposed (secrets hygiene)
# - Write access is limited to temporary directories and output folders
# - Memory and time limits prevent resource exhaustion