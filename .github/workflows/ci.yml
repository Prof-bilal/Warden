name: CI

# The Go module lives at warden-starter/warden; every `run:` step below
# resolves against that directory (see defaults). This is the primary CI:
# it replaces the old root go.yml (build+test only) and — critically —
# runs the Windows job, which is the only place the WFP/AppContainer/ETW
# escape and lifecycle tests execute for real.
on:
  pull_request:
  push:
    # '**' matches every branch but not tag pushes (release.yml owns tags).
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: warden-starter/warden

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # GitHub-hosted Windows runners run elevated, so the WFP/AppContainer/ETW
  # escape and lifecycle tests execute for real instead of skipping: this job
  # is the verifier for the Windows backend's syscall mirrors and the ETW
  # session (see syscalls.go and etw.go).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go build ./...
      - run: go vet ./...
      - shell: pwsh
        run: go test -v ./...
        id: test
      - name: Assert ETW and escape tests actually ran
        # Run even when the test step panics or fails (e.g. missing DLL
        # export causing a process exit) so the assertion is never silenced.
        if: always() && steps.test.outcome != 'skipped'
        shell: pwsh
        run: |
          $out = go test -v -count=1 -run 'TestEtw|TestEscape|TestAppContainer|TestWFP' ./internal/sandbox/windows/ 2>&1 | Out-String
          Write-Host $out
          # Tests must have been discovered (RUN line present). If none were
          # found, the package didn't compile the test file — fail loudly.
          if ($out -notmatch '=== RUN') { throw "no ETW/escape/AppContainer/WFP tests discovered; output above" }
          # If tests ran but panicked (missing DLL export), the process would
          # have exited non-zero before the assertion — caught by the step
          # itself. Here we check for the case where tests were found but all
          # skipped: that is acceptable only when Supported() returns false
          # (AppContainer API not available on this runner). If any test
          # panicked instead of skipping, the output contains "panic:" which
          # we flag.
          if ($out -match '(?m)^\s*--- SKIP:') {
            if ($out -match 'panic:') { throw "ETW/escape tests panicked instead of skipping — investigate" }
            Write-Host "ETW/escape tests skipped (AppContainer not available on this runner) — acceptable"
          }
          # If tests actually ran, they must pass.
          if ($out -match '(?m)^\s*--- PASS:') {
            if ($out -notmatch '(?m)^ok\s') { throw "targeted Windows test run did not pass" }
          }

  # GitHub-hosted macOS runners include sandbox-exec, so the Seatbelt
  # escape and lifecycle tests execute for real instead of skipping.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go clean -cache
      - run: go build ./...
      - run: go vet ./...
      - run: go test -v -count=1 ./internal/sandbox/darwin/...
      - run: go test -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
