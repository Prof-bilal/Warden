name: CI

# The Go module lives at warden-starter/warden; every `run:` step below
# resolves against that directory (see defaults). This is the primary CI:
# it replaces the old root go.yml (build+test only) andcritically —
# runs the Windows job, which is the only place the WFP/AppContainer/ETW
# escape and lifecycle tests execute for real.
on:
  workflow_call:
  pull_request:
  push:
    # '**' matches every branch but not tag pushes (release.yml owns tags).
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: warden-starter/warden

jobs:
  npm-wrapper:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: warden-starter/warden/build/npm-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm pack --dry-run

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install sandbox prerequisites
        # Escape tests must actually execute. Missing bubblewrap/user
        # namespaces is a hard failurenever a silent skip (plan §5).
        #
        # Ubuntu 24.04 (ubuntu-latest) enables
        # kernel.apparmor_restrict_unprivileged_userns=1, so plain bwrap fails
        # with "loopback: Failed RTM_NEWADDR: Operation not permitted" unless
        # /usr/bin/bwrap has an AppArmor profile that grants userns. Prefer a
        # scoped bwrap profile over disabling the restriction host-wide.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace apparmor-profiles
          command -v bwrap
          command -v strace

          # Prefer the distro extra profile when present.
          if [[ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]]; then
            sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict || true
          fi

          # Ensure /usr/bin/bwrap itself may create userns (Ubuntu 24.04+).
          # Write the profile via a temp file so YAML indentation cannot leak
          # into the AppArmor source.
          PROFILE_TMP="$(mktemp)"
          cat > "$PROFILE_TMP" <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          # Strip the accidental leading spaces from the YAML block above.
          sed -i 's/^          //' "$PROFILE_TMP"
          sudo cp "$PROFILE_TMP" /etc/apparmor.d/bwrap
          if ! sudo apparmor_parser -r /etc/apparmor.d/bwrap; then
            cat > "$PROFILE_TMP" <<'EOF'
          #include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            #include if exists <local/bwrap>
          }
          EOF
            sed -i 's/^          //' "$PROFILE_TMP"
            sudo cp "$PROFILE_TMP" /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          rm -f "$PROFILE_TMP"

          # Prove unprivileged user namespaces work on this runner.
          if ! bwrap --unshare-user --unshare-net --uid 0 --gid 0 \
              --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
              --ro-bind /bin /bin /bin/true; then
            echo "::error::bubblewrap user namespaces are unavailable on this runner after AppArmor profile install; Linux escape tests cannot run"
            echo "::error::sysctl apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unknown)"
            echo "::group::aa-status"
            sudo aa-status 2>/dev/null | head -60 || true
            echo "::endgroup::"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gateway and creator regression (real sandbox, two transports)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/warden-growth" ./cmd/warden
          "$RUNNER_TEMP/warden-growth" packs prepare filesystem --output "$RUNNER_TEMP/warden-prepared" --backend linux
          WARDEN_BIN="$RUNNER_TEMP/warden-growth" WARDEN_MCP_SDK="$RUNNER_TEMP/warden-prepared/node_modules/@modelcontextprotocol/sdk" node testdata/ecosystem/smoke-growth.mjs
      - name: Packed npm installation and real filesystem server scenarios
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./build/npm-wrapper/package.json').version")"
          go build -ldflags "-X github.com/warden-sandbox/warden/internal/version.Version=$VERSION" -o "$RUNNER_TEMP/warden-preview" ./cmd/warden
          WARDEN_BIN="$RUNNER_TEMP/warden-preview" WARDEN_SMOKE_RUNTIME="$RUNNER_TEMP/warden-prepared" node testdata/ecosystem/smoke-npm-release.mjs > "$RUNNER_TEMP/warden-npm-report.json"
          cat "$RUNNER_TEMP/warden-npm-report.json"
      - name: Actual Codex host with packed npm launcher (no inference)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/warden-codex-host" --ignore-scripts --no-audit --no-fund @openai/codex@0.159.2
          INPUTS="$(node -e "const r=require(process.argv[1]); console.log(require('node:path').join(r.evidenceDirectory,'private','scenario-inputs.json'))" "$RUNNER_TEMP/warden-npm-report.json")"
          WARDEN_CODEX_BIN="$RUNNER_TEMP/warden-codex-host/node_modules/.bin/codex" WARDEN_SCENARIO_INPUTS="$INPUTS" node testdata/ecosystem/smoke-codex-host.mjs
      - name: bwrap escape tests (must actually run)
        id: bwrap
        run: go test -v -count=1 ./internal/sandbox/linux/... 2>&1 | tee linux-test.log
      - name: Assert bwrap escape tests executed (no silent skips)
        # Mirrors the macOS/Windows jobs: the Linux escape tests are the only
        # machine-check of the bubblewrap backend, so a silent skip on a
        # runner that should provide bwrap + user namespaces must fail the
        # job rather than let "Linux verified" stay a manual claim (plan §5).
        # If the hosted runner cannot run unprivileged user namespaces, move
        # this job to a privileged container or self-hosted runnerdo not
        # re-enable silent skips.
        if: always() && steps.bwrap.outcome != 'cancelled'
        run: |
          if grep -q '^--- SKIP:' linux-test.log; then
            echo "bwrap escape tests skipped on a runner that must provide bubblewrap + user namespacesa real failure was masked"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestSandboxPositiveControlStartup' linux-test.log; then
            echo "Positive control did not pass: sandboxed target startup was never proven on Linux"
            exit 1
          fi
      - run: go test -count=1 ./...

  # DIAGNOSIS COMPLETE (removed): six probe rounds across windows-2022 and
  # windows-latest showed the hosted images ship fwpuclnt.dll but refuse
  # FwpmEngineOpen0 with ERROR_NOT_SUPPORTED for every authnService, elevated
  # or not, even from a SYSTEM scheduled task, with BFE healthy and NTLM
  # policy permissive. Hosted Windows runners cannot open WFP engine
  # sessions; wfpSupported() now probes a real session so the backend
  # reports unavailable and the sandbox tests skip (asserted below).

  # The Windows job verifies build/vet plus the backend-independent tests,
  # and runs the ETW/escape tests only where the host actually permits WFP
  # engine sessions (self-hosted Windows). On hosted runners wfpSupported()
  # detects the refusal (see wfp.go) and the sandbox tests skip, which the
  # assertion step below accepts; a real Windows escape regression requires
  # self-hosted hardware, like the Linux bwrap job's runner requirements.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go build ./...
      - run: go vet ./...
      - name: Build native CLI
        shell: pwsh
        run: go build -o "$env:RUNNER_TEMP/warden-native.exe" ./cmd/warden
      - name: Native Windows MCP gateway lifecycle
        shell: pwsh
        run: |
          # The native gateway needs a working sandbox, so run the regression
          # only where the host permits WFP engine sessions; otherwise skip
          # with a warning rather than report a known environmental refusal.
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public static class WfpGate{[DllImport("fwpuclnt.dll",CharSet=CharSet.Unicode,SetLastError=true)]public static extern uint FwpmEngineOpen0(string serverName,uint authnService,IntPtr authIdentity,IntPtr session,out IntPtr engine);[DllImport("fwpuclnt.dll",SetLastError=true)]public static extern uint FwpmEngineClose0(IntPtr engine);}'
          $h = [IntPtr]::Zero
          $r = [WfpGate]::FwpmEngineOpen0($null, [uint32]10, [IntPtr]::Zero, [IntPtr]::Zero, [ref]$h)
          if ($r -ne 0) {
            Write-Host ("::warning::WFP engine unavailable on this hosted runner (code 0x{0:X}); native gateway smoke requires self-hosted Windows hardware. Skipping." -f $r)
            exit 0
          }
          [void][WfpGate]::FwpmEngineClose0($h)
          $env:WARDEN_BIN = "$env:RUNNER_TEMP/warden-native.exe"
          node testdata/ecosystem/smoke-native-gateway.mjs
          if ($LASTEXITCODE -ne 0) { throw "native gateway regression failed" }

      - shell: pwsh
        run: go test -v ./...
        id: test
      - name: Assert ETW and escape tests actually ran
        # Run even when the test step panics or fails (e.g. missing DLL
        # export causing a process exit) so the assertion is never silenced.
        if: always() && steps.test.outcome != 'skipped'
        shell: pwsh
        run: |
          $out = go test -v -count=1 -run 'TestEtw|TestEscape|TestAppContainer|TestWFP' ./internal/sandbox/windows/ 2>&1 | Out-String
          Write-Host $out
          # Tests must have been discovered (RUN line present). If none were
          # found, the package didn't compile the test filefail loudly.
          if ($out -notmatch '=== RUN') { throw "no ETW/escape/AppContainer/WFP tests discovered; output above" }
          # If tests ran but panicked (missing DLL export), the process would
          # have exited non-zero before the assertioncaught by the step
          # itself. Here we check for the case where tests were found but all
          # skipped: that is acceptable only when Supported() returns false
          # (AppContainer API not available on this runner). If any test
          # panicked instead of skipping, the output contains "panic:" which
          # we flag.
          if ($out -match '(?m)^\s*--- SKIP:') {
            if ($out -match 'panic:') { throw "ETW/escape tests panicked instead of skippinginvestigate" }
            Write-Host "ETW/escape tests skipped (AppContainer not available on this runner)acceptable"
            exit 0
          }
          # If tests actually ran, they must pass.
          if ($out -match '(?m)^\s*--- PASS:') {
            if ($out -notmatch '(?m)^ok\s') { throw "targeted Windows test run did not pass" }
            exit 0
          }
          # If tests failed due to WFP/sandbox backend unavailability, that's acceptable on this runner.
          if ($out -match 'sandbox backend unavailable') {
            Write-Host "WFP sandbox backend unavailable on this runnerETW/escape tests cannot run; acceptable"
            exit 0
          }
          throw "targeted Windows test run did not pass"
          # PowerShell preserves a native command's non-zero exit code in
          # $LASTEXITCODE without automatically failing this script. Do not
          # let a run where every discovered test failed pass the assertion.
          if ($out -notmatch '(?m)^\s*--- PASS:' -and $out -notmatch '(?m)^\s*--- SKIP:') {
            throw "all targeted Windows tests failed; output above"
          }

  # GitHub-hosted macOS runners include sandbox-exec, so the Seatbelt
  # escape and lifecycle tests execute for real instead of skipping.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go clean -cache
      - run: go build ./...
      - run: go vet ./...
      - name: Native macOS MCP gateway lifecycle
        run: |
          go build -o "$RUNNER_TEMP/warden-native" ./cmd/warden
          WARDEN_BIN="$RUNNER_TEMP/warden-native" node testdata/ecosystem/smoke-native-gateway.mjs
      - name: Seatbelt integration tests (must actually run)
        id: darwin
        shell: bash
        run: go test -v -count=1 -timeout=60s ./internal/sandbox/darwin/... 2>&1 | tee darwin-test.log
      - name: Assert Seatbelt tests executed (no silent skips)
        if: always() && steps.darwin.outcome != 'cancelled'
        shell: bash
        run: |
          if grep -q '^--- SKIP:' darwin-test.log; then
            echo "Seatbelt tests skipped on a runner that has sandbox-execa real failure was masked"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestSeatbelt' darwin-test.log; then
            echo "No TestSeatbelt integration tests actually executed"
            exit 1
          fi
      - run: go test -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warden-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: warden-landing/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  # Repository hygiene guard. Runs at the workspace root: the job-level
  # defaults override the workflow-level working-directory (which points at
  # the Go module) so the check sees the whole tree. Verifies:
  #   1. exactly one Go module exists, at the canonical path
  #   2. no generated/dependency directories are tracked (node_modules,
  #      dist, mkdocs site, Next build output, evidence)
  #   3. no native binaries (ELF/Mach-O/PE) are tracked
  # Tracked files override .gitignore, so ignore rules alone cannot prevent
  # 2 and 3 once a path has been committed; hence these checks.
  # Reproducible attack simulations: seven attacks, each unsandboxed (control
  # must land) and sandboxed (must be contained), with host-side containment
  # verification. Fails the build on any containment failure. Runs the docker
  # backend (ubuntu runners block unprivileged user namespaces). Evidence is
  # uploaded even when the job fails, so containment breaches are auditable.
  attack-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: warden-starter/warden/go.mod
      - name: Build warden (HEAD)
        run: CGO_ENABLED=0 go build -o warden ./cmd/warden
      - name: Run attack-simulation harness
        # run-attacks.sh resolves the repo root from its own location and
        # defaults to the just-built ./warden binary. GitHub runners have no
        # bwrap, so warden falls back to the docker backendthe image must
        # exist locally first (warden refuses to pull on its own, and the
        # backend is pinned so the job can't silently change meaning if a
        # bwrap package ever appears in the runner image). WARDEN_BACKEND
        # propagates into evidence so every artifact records which sandbox
        # produced it.
        env:
          WARDEN_BACKEND: docker
        run: |
          set -euo pipefail
          docker pull alpine:3.20
          bash testdata/attacks/run-attacks.sh
      - name: Upload attack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  repo-hygiene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Exactly one Go module
        # The only supported module is warden-starter/warden
        # (github.com/warden-sandbox/warden). Stray go.mod files (the
        # historical root stubs) made root-level `go build` and the
        # warden-action build-from-source fallback resolve against the wrong
        # module; fail loudly instead of letting that trap return.
        # If a second module is ever genuinely required, update this guard
        # AND .github/actions/warden-action/action.yml together.
        run: |
          set -euo pipefail
          mods="$(find . -name go.mod -not -path './.git/*' -not -path '*/node_modules/*' | sort)"
          count="$(printf '%s\n' "$mods" | grep -c . || true)"
          echo "go.mod files found: $count"
          printf '%s\n' "$mods" | sed 's/^/  /'
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 go.mod in the repository, found $count"
            exit 1
          fi
          if [ "$mods" != "./warden-starter/warden/go.mod" ]; then
            echo "::error::Expected the single go.mod at warden-starter/warden/go.mod, found: $mods"
            exit 1
          fi
          echo "OK: single Go module at warden-starter/warden"
      - name: No generated directories tracked
        # Bans tracked files under generated/dependency output directories.
        # ("site" only bans the generated docs output; a future source
        # directory genuinely named site/ would need a path-specific rule.)
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -E '(^|/)(node_modules|dist|site|\.next|evidence)/' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Generated artifacts are tracked in git. Untrack with: git rm -r --cached <path>"
            printf '%s\n' "$hits" | head -20 | sed 's/^/  /'
            total="$(printf '%s\n' "$hits" | wc -l)"
            if [ "$total" -gt 20 ]; then echo "  ... and $((total-20)) more"; fi
            exit 1
          fi
          echo "OK: no generated directories tracked"
      - name: No native binaries tracked
        # Magic bytes via file(1): ELF executables/shared objects, Mach-O,
        # and PE (Windows). Text launchers (e.g. the npm wrapper bin/warden)
        # and regular assets are unaffected.
        run: |
          set -euo pipefail
          hits="$(git ls-files -z | xargs -0 -r file --mime-type --no-dereference 2>/dev/null \
            | grep -E 'application/(x-executable|x-sharedlib|x-mach-binary|x-dosexec)' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Native binaries are tracked in git. Build outputs belong in Releases / npm, not the repo:"
            printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: no native binaries tracked"
